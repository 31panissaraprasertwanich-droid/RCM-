<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบ RCM และตารางรหัสความเสียหายสถานีไฟฟ้า — RCM & Failure Code Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* กำหนดตัวแปรธีมสีเริ่มต้น (Dark Mode + สีทองเหลือง Amber) */
  :root {
    --bg: #10151a;
    --panel: #171e25;
    --panel-2: #1d252d;
    --border: #2a333c;
    --text: #e7ecf0;
    --muted: #8b98a3;
    
    --primary: #e8a33d;
    --primary-dim: #4a3a20;
    
    --teal: #4fb8a6;
    --teal-dim: #1c3a37;
    --danger: #d9694f;
  }

  /* ธีม Light Mode (เมื่อกดสว่าง) */
  body.light-mode {
    --bg: #f4f7f9;
    --panel: #ffffff;
    --panel-2: #e9edf1;
    --border: #cbd5e1;
    --text: #1e293b;
    --muted: #64748b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--panel-2) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family:'Noto Sans Thai', system-ui, sans-serif;
    min-height:100vh;
    transition: background 0.2s, color 0.2s;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}

  header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--panel);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:16px 28px;
    transition: background 0.2s, border-color 0.2s;
  }
  .header-inner{
    max-width:1300px;
    margin:0 auto;
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  h1{
    font-size:1.25rem;
    font-weight:700;
    margin:0;
  }
  h1 .accent{color: var(--primary);}
  .subtitle{
    color:var(--muted);
    font-size:0.8rem;
    margin-top:2px;
  }
  
  .header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ปุ่มปรับแต่งธีม (โหมดสว่าง/มืด และเลือกสี) */
  .theme-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .color-dot {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-dot:hover { transform: scale(1.2); }
  .color-dot.active { border-color: #fff; }

  .mode-toggle-btn {
    background: none; border: none; cursor: pointer; color: var(--text);
    font-size: 1rem; padding: 2px 6px; border-radius: 4px;
  }
  .mode-toggle-btn:hover { background: var(--border); }

  .nav-tabs{display:flex; gap:6px;}
  .tab-btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--muted);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.8rem; transition:all .15s;
  }
  .tab-btn:hover{border-color:var(--primary); color:var(--text);}
  .tab-btn.active{
    background: var(--primary-dim); 
    border-color: var(--primary); 
    color: var(--primary); 
    font-weight:600;
  }

  .save-btn{
    background:var(--teal-dim); border:1px solid var(--teal); color:var(--teal);
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600; font-family:inherit;
  }
  .save-btn:hover{background:#264d47;}

  .count-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    color:var(--teal);
    background:var(--teal-dim);
    border:1px solid var(--teal);
    border-radius:4px;
    padding:5px 10px;
    white-space:nowrap;
  }
  .count-badge b{font-size:1rem;}

  .search-wrap{
    position:relative;
    margin-bottom:10px;
  }
  #search{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:inherit;
    font-size:0.9rem;
    padding:10px 14px 10px 40px;
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease;
  }
  #search:focus{ border-color: var(--primary); }
  .search-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke:var(--muted);
  }

  .chips{
    display:flex; flex-wrap:wrap; gap:6px; max-height:80px; overflow-y:auto; padding-bottom:2px;
  }
  .chip{
    font-size:0.75rem; padding:4px 10px; border-radius:100px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--muted);
    cursor:pointer; user-select:none; transition:all .12s ease; white-space:nowrap;
  }
  .chip:hover{border-color:var(--primary); color:var(--text);}
  .chip.active{
    background: var(--primary-dim);
    border-color: var(--primary);
    color: var(--primary);
  }

  main{
    max-width:1300px;
    margin:0 auto;
    padding:20px 28px 60px;
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty .big{
    font-family:'IBM Plex Mono', monospace; font-size:2rem; color:var(--border); margin-bottom:8px;
  }

  table{
    width:100%; border-collapse:collapse; font-size:0.85rem; background: var(--panel); border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
  }
  thead th{
    text-align:left; font-size:0.7rem; color:var(--muted); font-weight:600;
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--panel-2);
  }
  
  tbody tr{
    border-bottom:1px solid var(--border); transition:background .1s ease;
  }
  tbody tr:hover{background:var(--panel-2);}
  tbody td{
    padding:10px 12px; vertical-align:middle;
  }
  td.num{
    color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
  }
  .code-pill{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:0.8rem; color: var(--primary); background: var(--primary-dim);
    border-left:3px solid var(--primary); padding:2px 7px; border-radius:3px;
  }
  
  input.score-input {
    width: 60px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px; text-align: center; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem;
  }
  input.score-input:focus { border-color: var(--primary); outline: none; }
  
  input.text-input, select.text-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 0.82rem;
  }
  input.text-input:focus, select.text-input:focus { border-color: var(--primary); outline: none; }

  .rpn-badge {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; padding: 4px 8px;
    border-radius: 4px; display: inline-block; text-align: center; min-width: 45px;
  }
  .rpn-low { background: #1c3a37; color: var(--teal); }
  .rpn-mid { background: #4a3a20; color: #e8a33d; }
  .rpn-high { background: #4a2720; color: var(--danger); }

  mark{
    background: var(--primary-dim); color:inherit; border-radius:2px; padding:0 1px;
  }

  .section-label{
    font-size:0.78rem; color:var(--muted); margin:0 0 10px 2px;
    display: flex; justify-content: space-between; align-items: center;
  }

  footer{
    max-width:1300px; margin:0 auto; padding:0 28px 40px; color:var(--muted); font-size:0.75rem;
  }

  @media (max-width:768px){
    header{padding:12px 16px;}
    main{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-row">
      <div>
        <h1>ระบบ RCM สถานีไฟฟ้า: <span class="accent" id="modeTitle">FMEA & RPN Assessment</span></h1>
        <div class="subtitle">จัดการข้อมูลความเสียหายและจัดลำดับแผนงานซ่อมบำรุงอัตโนมัติ</div>
      </div>
      
      <div class="header-controls">
        <!-- เครื่องมือปรับความสว่างและเปลี่ยนสีธีม -->
        <div class="theme-tools">
          <div class="color-dot active" style="background:#e8a33d;" onclick="setThemeColor('#e8a33d', '#4a3a20')" title="สีทอง (Amber)"></div>
          <div class="color-dot" style="background:#4fb8a6;" onclick="setThemeColor('#4fb8a6', '#1c3a37')" title="สีเทอร์ควอยซ์ (Teal)"></div>
          <div class="color-dot" style="background:#3b82f6;" onclick="setThemeColor('#3b82f6', '#1e3a8a')" title="สีน้ำเงิน (Blue)"></div>
          <div class="color-dot" style="background:#a855f7;" onclick="setThemeColor('#a855f7', '#3b0764')" title="สีม่วง (Purple)"></div>
          <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleLightDarkMode()" title="สลับโหมด มืด/สว่าง">🌙</button>
        </div>

        <div class="nav-tabs">
          <button class="tab-btn active" onclick="switchTab('fmea')">1. FMEA & RPN</button>
          <button class="tab-btn" onclick="switchTab('cehi')">2. โครงสร้าง CEHI</button>
          <button class="tab-btn" onclick="switchTab('plan')" id="btnPlan">3. PM/CBM Action Plan</button>
        </div>
        <button class="save-btn" onclick="saveData()">💾 บันทึกข้อมูล</button>
        <div class="count-badge">แสดง <b id="visibleCount">0</b> / <span id="totalCount">0</span> รายการ</div>
      </div>
    </div>

    <div class="search-wrap" id="searchBoxWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="พิมพ์ค้นหารหัส เช่น T001, Component, หรือสาเหตุ..." autocomplete="off">
    </div>

    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <div class="section-label">
    <span id="tableInstruction">คลิกช่องคะแนน (S, O, D) เพื่อประเมินค่า RPN อัตโนมัติ</span>
  </div>
  <table>
    <thead id="tableHead"></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">∅</div>
    ไม่พบรายการที่ตรงกับคำค้นหา
  </div>
</main>

<footer>
  ฐานข้อมูล RCM จากไฟล์ RCM.xlsx (ข้อมูลจริง 223 รายการ) — ระบบบันทึกอัตโนมัติผ่าน LocalStorage
</footer>

  {id:221, component:"เสา/สาย", code:"SM33", desc:"สายส่งไม่มีไฟ", cause:"อื่นๆ", s:"", o:"", d:"", testCategory:"", testItems:"", si:"", smax:"", wi:"", actionType:"PM", actionPlan:"", status:"รอแผนงาน"},
  {id:222, component:"เสา/สาย", code:"SM34", desc:"Charge Line", cause:"อื่นๆ", s:"", o:"", d:"", testCategory:"", testItems:"", si:"", smax:"", wi:"", actionType:"PM", actionPlan:"", status:"รอแผนงาน"}
];

let categories = [];
let activeCat = "ALL";
let query = "";
let currentTab = 'fmea';

function initApp() {
  const saved = localStorage.getItem('rcm_excel_data_v4');
  if (saved) {
    try { records = JSON.parse(saved); } catch(e) { console.error(e); }
  }
  
  // โหลดค่าธีมที่ผู้ใช้เคยเลือกไว้
  const savedTheme = localStorage.getItem('rcm_theme_mode');
  if (savedTheme === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('modeToggleBtn').textContent = '☀️';
  }
  const savedColor = localStorage.getItem('rcm_theme_primary');
  const savedDim = localStorage.getItem('rcm_theme_dim');
  if (savedColor && savedDim) {
    setThemeColor(savedColor, savedDim, false);
  }

  records.forEach(r => {
    if(!r.cat) {
      r.cat = r.component ? r.component.split('_')[0] : 'OTHER';
    }
  });

  categories = [...new Set(records.map(r => r.cat))];
  document.getElementById('totalCount').textContent = records.length;
  renderChips();
  renderTable();
}

// ฟังก์ชันสลับโหมด มืด / สว่าง
function toggleLightDarkMode() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  document.getElementById('modeToggleBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('rcm_theme_mode', isLight ? 'light' : 'dark');
}

// ฟังก์ชันเปลี่ยนสีธีมหลัก
function setThemeColor(primaryColor, dimColor, save = true) {
  document.documentElement.style.setProperty('--primary', primaryColor);
  document.documentElement.style.setProperty('--primary-dim', dimColor);
  
  // อัปเดตสถานะ Active ของปุ่มวงกลมสี
  document.querySelectorAll('.color-dot').forEach(dot => {
    dot.classList.remove('active');
    if(dot.style.background.includes(primaryColor) || dot.getAttribute('onclick').includes(primaryColor)) {
      dot.classList.add('active');
    }
  });

  if (save) {
    localStorage.setItem('rcm_theme_primary', primaryColor);
    localStorage.setItem('rcm_theme_dim', dimColor);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  if(tab === 'fmea') {
    event.target.classList.add('active');
    document.getElementById('modeTitle').textContent = "FMEA & RPN Assessment";
    document.getElementById('tableInstruction').textContent = "คลิกช่องคะแนน (S, O, D) ระบบจะคำนวณค่า RPN ให้ทันที";
    document.getElementById('searchBoxWrap').style.display = 'block';
    document.getElementById('chips').style.display = 'flex';
  } else if(tab === 'cehi') {
    event.target.classList.add('active');
    document.getElementById('modeTitle').textContent = "ตารางโครงสร้าง CEHI";
    document.getElementById('tableInstruction').textContent = "กรอก Test Category, Parameters และคะแนน Si, Smax, Wi เพื่อคำนวณดัชนีสุขภาพ";
    document.getElementById('searchBoxWrap').style.display = 'block';
    document.getElementById('chips').style.display = 'flex';
  } else if(tab === 'plan') {
    event.target.classList.add('active');
    document.getElementById('modeTitle').textContent = "PM/CBM Action Plan Table";
    document.getElementById('tableInstruction').textContent = "แสดงรายการที่ผ่านการประเมินคะแนน (RPN > 0) เรียงลำดับความสำคัญอัตโนมัติ";
    document.getElementById('searchBoxWrap').style.display = 'none';
    document.getElementById('chips').style.display = 'none';
  }
  renderTable();
}

const chipsWrap = document.getElementById('chips');
function renderChips(){
  chipsWrap.innerHTML = '';
  chipsWrap.appendChild(makeChip('ทั้งหมด (' + records.length + ')', 'ALL'));
  categories.forEach(c => {
    const count = records.filter(r => r.cat === c).length;
    chipsWrap.appendChild(makeChip(c + ' (' + count + ')', c));
  });
}

function makeChip(label, val){
  const c = document.createElement('div');
  c.className = 'chip' + (activeCat === val ? ' active' : '');
  c.textContent = label;
  c.addEventListener('click', () => { activeCat = val; renderChips(); renderTable(); });
  return c;
}

const tbody = document.getElementById('tbody');
const emptyState = document.getElementById('emptyState');
const visibleCountEl = document.getElementById('visibleCount');

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function highlight(text, q){
  const esc = escapeHtml(text);
  if(!q) return esc;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}

function renderTable(){
  const q = query.trim().toLowerCase();
  const thead = document.getElementById('tableHead');
  
  let filtered = [];

  if (currentTab === 'plan') {
    filtered = records.filter(r => {
      const s = Number(r.s) || 0;
      const o = Number(r.o) || 0;
      const d = Number(r.d) || 0;
      return (s * o * d) > 0;
    });
    
    filtered.sort((a, b) => {
      const rpnA = (Number(a.s)||0) * (Number(a.o)||0) * (Number(a.d)||0);
      const rpnB = (Number(b.s)||0) * (Number(b.o)||0) * (Number(b.d)||0);
      return rpnB - rpnA;
    });
  } else {
    filtered = records.filter(r => {
      if(activeCat !== 'ALL' && r.cat !== activeCat) return false;
      if(!q) return true;
      return (
        (r.code && r.code.toLowerCase().includes(q)) ||
        (r.desc && r.desc.toLowerCase().includes(q)) ||
        (r.cause && r.cause.toLowerCase().includes(q)) ||
        (r.component && r.component.toLowerCase().includes(q))
      );
    });
  }

  if (currentTab === 'fmea') {
    thead.innerHTML = `
      <tr>
        <th style="width:40px;">#</th>
        <th style="width:140px;">Component</th>
        <th style="width:90px;">รหัส</th>
        <th>Failure Mode / อาการ</th>
        <th>Failure Cause / สาเหตุ</th>
        <th style="width:65px; text-align:center;">S</th>
        <th style="width:65px; text-align:center;">O</th>
        <th style="width:65px; text-align:center;">D</th>
        <th style="width:75px; text-align:center;">RPN</th>
      </tr>
    `;
    
    tbody.innerHTML = filtered.map(r => {
      const s = Number(r.s) || 0;
      const o = Number(r.o) || 0;
      const d = Number(r.d) || 0;
      const rpn = s > 0 && o > 0 && d > 0 ? s * o * d : '';
      
      let badgeClass = 'rpn-low';
      if (rpn >= 100) badgeClass = 'rpn-high';
      else if (rpn >= 40) badgeClass = 'rpn-mid';

      return `
        <tr>
          <td class="num">${r.id}</td>
          <td><b>${escapeHtml(r.component)}</b></td>
          <td><span class="code-pill mono">${escapeHtml(r.code)}</span></td>
          <td>${highlight(r.desc, q)}</td>
          <td style="color:var(--muted);">${highlight(r.cause, q)}</td>
          <td style="text-align:center;"><input type="number" min="1" max="10" class="score-input" value="${r.s !== undefined ? r.s : ''}" oninput="updateField(${r.id}, 's', this.value)"></td>
          <td style="text-align:center;"><input type="number" min="1" max="10" class="score-input" value="${r.o !== undefined ? r.o : ''}" oninput="updateField(${r.id}, 'o', this.value)"></td>
          <td style="text-align:center;"><input type="number" min="1" max="10" class="score-input" value="${r.d !== undefined ? r.d : ''}" oninput="updateField(${r.id}, 'd', this.value)"></td>
          <td style="text-align:center;"><span class="rpn-badge ${rpn !== '' ? badgeClass : ''}">${rpn !== '' ? rpn : '-'}</span></td>
        </tr>
      `;
    }).join('');

  } else if (currentTab === 'cehi') {
    thead.innerHTML = `
      <tr>
        <th style="width:40px;">#</th>
        <th style="width:140px;">Component</th>
        <th>Test Category</th>
        <th>Test Items / Parameters</th>
        <th style="width:80px; text-align:center;">Si</th>
        <th style="width:80px; text-align:center;">Smax</th>
        <th style="width:80px; text-align:center;">Wi</th>
        <th style="width:90px; text-align:center;">Si x Wi</th>
        <th style="width:90px; text-align:center;">Smax x Wi</th>
      </tr>
    `;
    
    tbody.innerHTML = filtered.map(r => {
      const si = Number(r.si) || 0;
      const smax = Number(r.smax) || 0;
      const wi = Number(r.wi) || 0;
      const siWi = si > 0 && wi > 0 ? (si * wi).toFixed(2) : '-';
      const smaxWi = smax > 0 && wi > 0 ? (smax * wi).toFixed(2) : '-';

      return `
        <tr>
          <td class="num">${r.id}</td>
          <td><b>${escapeHtml(r.component)}</b></td>
          <td><input type="text" class="text-input" value="${escapeHtml(r.testCategory || '')}" oninput="updateField(${r.id}, 'testCategory', this.value)"></td>
          <td><input type="text" class="text-input" value="${escapeHtml(r.testItems || '')}" oninput="updateField(${r.id}, 'testItems', this.value)"></td>
          <td style="text-align:center;"><input type="number" class="score-input" value="${r.si !== undefined ? r.si : ''}" oninput="updateField(${r.id}, 'si', this.value)"></td>
          <td style="text-align:center;"><input type="number" class="score-input" value="${r.smax !== undefined ? r.smax : ''}" oninput="updateField(${r.id}, 'smax', this.value)"></td>
          <td style="text-align:center;"><input type="number" class="score-input" value="${r.wi !== undefined ? r.wi : ''}" oninput="updateField(${r.id}, 'wi', this.value)"></td>
          <td style="text-align:center;" class="mono">${siWi}</td>
          <td style="text-align:center;" class="mono">${smaxWi}</td>
        </tr>
      `;
    }).join('');

  } else {
    thead.innerHTML = `
      <tr>
        <th style="width:50px; text-align:center;">ลำดับ</th>
        <th style="width:130px;">Component</th>
        <th style="width:80px;">รหัส</th>
        <th>Failure Mode / อาการความเสียหาย</th>
        <th style="width:70px; text-align:center;">RPN</th>
        <th style="width:110px; text-align:center;">ประเภทแผน (PM/CBM)</th>
        <th style="width:250px;">รายละเอียดแผนการซ่อมบำรุง (Action Plan)</th>
        <th style="width:110px; text-align:center;">สถานะ</th>
      </tr>
    `;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:50px; color:var(--muted);">⚠️ ยังไม่มีข้อมูลแผนงาน เนื่องจากคุณยังไม่ได้ประเมินคะแนน (S, O, D) ในหน้า FMEA & RPN</td></tr>`;
    } else {
      tbody.innerHTML = filtered.map((r, index) => {
        const rpn = (Number(r.s)||0) * (Number(r.o)||0) * (Number(r.d)||0);
        let badgeClass = 'rpn-low';
        if (rpn >= 100) badgeClass = 'rpn-high';
        else if (rpn >= 40) badgeClass = 'rpn-mid';

        return `
          <tr>
            <td style="text-align:center;"><span class="mono" style="font-weight:bold; color:var(--primary);">#${index + 1}</span></td>
            <td><b>${escapeHtml(r.component)}</b></td>
            <td><span class="code-pill mono">${escapeHtml(r.code)}</span></td>
            <td>${escapeHtml(r.desc)}</td>
            <td style="text-align:center;"><span class="rpn-badge ${badgeClass}">${rpn}</span></td>
            <td style="text-align:center;">
              <select class="text-input" style="text-align:center;" onchange="updateField(${r.id}, 'actionType', this.value)">
                <option value="PM" ${r.actionType === 'PM' ? 'selected' : ''}>PM (ตามรอบ)</option>
                <option value="CBM" ${r.actionType === 'CBM' ? 'selected' : ''}>CBM (ตามสภาพ)</option>
              </select>
            </td>
            <td><input type="text" class="text-input" value="${escapeHtml(r.actionPlan || '')}" placeholder="ระบุวิธีป้องกัน/ซ่อมบำรุง..." oninput="updateField(${r.id}, 'actionPlan', this.value)"></td>
            <td style="text-align:center;">
              <select class="text-input" style="text-align:center;" onchange="updateField(${r.id}, 'status', this.value)">
                <option value="รอแผนงาน" ${r.status === 'รอแผนงาน' ? 'selected' : ''}>⏳ รอแผนงาน</option>
                <option value="กำลังดำเนินการ" ${r.status === 'กำลังดำเนินการ' ? 'selected' : ''}>🔄 กำลังทำ</option>
                <option value="เสร็จสิ้น" ${r.status === 'เสร็จสิ้น' ? 'selected' : ''}>✅ เสร็จสิ้น</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');
    }
  }

  visibleCountEl.textContent = filtered.length;
  emptyState.style.display = (filtered.length === 0 && currentTab !== 'plan') ? 'block' : 'none';
}

function updateField(id, field, val) {
  const item = records.find(r => r.id === id);
  if (item) {
    item[field] = val;
    if (currentTab === 'fmea' && ['s', 'o', 'd'].includes(field)) {
      renderTable();
    }
  }
}

function saveData() {
  localStorage.setItem('rcm_excel_data_v4', JSON.stringify(records));
  alert('✨ บันทึกข้อมูลคะแนนและแผนงานของคุณลงในเบราว์เซอร์เรียบร้อยแล้ว!');
}

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  renderTable();
});

initApp();
</script>
